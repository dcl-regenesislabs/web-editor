name: service image

on:
  pull_request:
    paths:
      - 'packages/service/**'
      - 'packages/contract/**'
      - 'packages/mobile-preview/**'
      - 'scripts/check-secrets*'
      - 'SECURITY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/service-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/service/**'
      - 'packages/contract/**'
      - 'packages/mobile-preview/**'
      - 'scripts/check-secrets*'
      - 'SECURITY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/service-image.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace @dcl-editor/service --include-workspace-root=false --ignore-scripts --no-audit
      - run: node scripts/check-secrets.mjs --history
      - name: Audit production dependencies offline
        env:
          OSV_SCALIBR_LOCAL_DB_CACHE_DIRECTORY: ${{ runner.temp }}/osv-db
        run: |
          npm sbom --workspace @dcl-editor/service --omit=dev --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/service.cdx.json"
          mkdir -p "$OSV_SCALIBR_LOCAL_DB_CACHE_DIRECTORY/osv-scalibr/npm"
          curl -fLsS --retry 3 https://osv-vulnerabilities.storage.googleapis.com/npm/all.zip -o "$OSV_SCALIBR_LOCAL_DB_CACHE_DIRECTORY/osv-scalibr/npm/all.zip"
          curl -fLsS --retry 3 https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --offline -L "$RUNNER_TEMP/service.cdx.json" --format gh-annotations
      - run: npm run typecheck --workspace @dcl-editor/service
      - run: npx vitest run packages/service/src
      - run: docker build -f packages/service/Dockerfile -t dcl-editor-service:local .
      - run: node packages/service/scripts/docker-smoke.mjs
