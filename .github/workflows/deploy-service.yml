# Deploys the project service (packages/service) to its droplet when a GitHub release (vX.Y.Z) is
# published, or by hand on a release tag. It copies only what the image builds from, keeps the
# droplet's own .env, compose.override.yaml and data, rebuilds the container, and fails unless
# /health answers with the tag it just deployed.
#
# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a key only this workflow uses) and
# DEPLOY_KNOWN_HOSTS (`ssh-keyscan <host>`). Variable: DEPLOY_DIR (the copy on the droplet, e.g.
# /opt/dcl-editor).
name: deploy-service

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Only release tags
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::run this on a release tag (vX.Y.Z), not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Copy the service source
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          rsync -rlt -R -e 'ssh -i ~/.ssh/deploy' \
            --exclude node_modules --exclude '.env*' --exclude compose.override.yaml --exclude .data --exclude '*.tsbuildinfo' \
            ./package.json ./package-lock.json ./packages/contract ./packages/service ./packages/mobile-preview "$TARGET:$DIR/"
      - name: Rebuild and restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" "cd '$DIR/packages/service' && \
            files='-f compose.yaml'; [ -f compose.override.yaml ] && files=\"\$files -f compose.override.yaml\"; \
            SERVICE_VERSION='$GITHUB_REF_NAME' docker compose \$files up --build -d --force-recreate"
      # on the droplet itself: Cloudflare answers GitHub's runners with a 403
      - name: Check /health names this release
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            version=$(ssh -i ~/.ssh/deploy "$TARGET" 'curl -fsS http://127.0.0.1:8787/health' | jq -r '.version // empty' || true)
            if [ "$version" = "$GITHUB_REF_NAME" ]; then echo "live: $version"; exit 0; fi
            sleep 10
          done
          echo "::error::the droplet's /health answers '${version:-nothing}', expected $GITHUB_REF_NAME"
          exit 1
