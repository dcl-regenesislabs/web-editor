services:
  editor-service:
    build:
      context: ../..
      dockerfile: packages/service/Dockerfile
      args:
        SERVICE_VERSION: ${SERVICE_VERSION:-}
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      HTTP_SERVER_HOST: 0.0.0.0
      HTTP_SERVER_PORT: "8787"
      STORAGE_DIR: /data/projects
      # nginx on the host sets it; Docker's gateway is a private peer, so the service believes it
      CLIENT_IP_HEADER: x-real-ip
    volumes:
      - editor-data:/data
    restart: unless-stopped
    # ASSISTANT_DRAIN_SECONDS (600) lets running assistant turns finish, plus the HTTP shutdown
    stop_grace_period: 11m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  editor-data:
